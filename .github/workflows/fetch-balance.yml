# Started by Power Automate (GitHub connector: "Create a repository dispatch event",
# Event Name = fetch-balance) or by the "Run workflow" button.
#
# Everything runs on GitHub's computers (your laptop is NOT used):
#   1. run fetch_billing.py with the session from the secret BILLING_STORAGE_STATE
#      -> fetch balance, save billing_data.json, end
#   2. publish billing_dashboard.html + billing_data.json on GitHub Pages

name: Fetch credit balance

on:
  repository_dispatch:
    types: [fetch-balance]
  workflow_dispatch:
  push:                      # frontend edits re-publish the page by themselves
    branches: [main]
    paths:
      - billing_dashboard.html
      - usage.html
      - billing_data.json

concurrency:
  group: fetch-balance
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name != 'push'   # a push only needs to re-publish, not re-fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run fetch_billing.py
        env:
          BILLING_STORAGE_STATE: ${{ secrets.BILLING_STORAGE_STATE }}
        run: python fetch_billing.py

      - name: Save billing_data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billing_data.json
          git diff --staged --quiet || git commit -m "New balance reading"
          git push

  publish:
    needs: fetch
    if: ${{ !cancelled() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - run: |
          mkdir _site
          cp billing_dashboard.html usage.html billing_data.json _site/
          cp billing_dashboard.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
