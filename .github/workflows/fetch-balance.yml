# Publish the dashboard on GitHub Pages.
#
# Runs on GitHub's computers (not your PC), only when fetch_billing.py uploads
# a new reading, then ends. Nothing keeps running anywhere.
#
#   python fetch_billing.py   ->  fetch balance, save, upload to GitHub, END
#   GitHub (this workflow)    ->  publish the page, END

name: Publish dashboard

on:
  push:
    branches: [main]
    paths:
      - billing_data.json
      - billing_data.js
      - billing_dashboard.html
  workflow_dispatch:          # "Run workflow" button, to publish by hand

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect only the dashboard files
        run: |
          mkdir _site
          cp billing_dashboard.html billing_data.json billing_data.js _site/
          cp billing_dashboard.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
