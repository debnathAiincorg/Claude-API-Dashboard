# Fetch the Claude API credit balance and publish the dashboard on GitHub Pages.
#
# Started by:
#   - Power Automate  -> GitHub connector "Create a repository dispatch event"
#                        with Event Name = fetch-balance
#   - the "Run workflow" button on the Actions tab (manual)
# There is NO GitHub time schedule here - Power Automate decides when it runs.
#
# Job 1 runs on YOUR PC (self-hosted runner), because the Claude login only
# exists there. Job 2 runs on GitHub and publishes the dashboard.

name: Fetch credit balance

on:
  repository_dispatch:
    types: [fetch-balance]
  workflow_dispatch:

# never run two at the same time (they would fight over the Edge login folder)
concurrency:
  group: fetch-balance
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch balance (on my PC)
    runs-on: [self-hosted, Windows]
    permissions:
      contents: write          # to save billing_data.json back to the repo
    defaults:
      run:
        shell: powershell
    env:
      # the login folder stays on the PC and is never uploaded
      BILLING_PROFILE_DIR: D:\Claude API Dashboard\.edge_billing_profile
      PYTHONIOENCODING: utf-8
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Fetch the balance from platform.claude.com
        run: python fetch_billing.py

      - name: Save the new reading to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billing_data.json billing_data.js
          git commit -m "New balance reading"
          git push

  publish:
    name: Publish dashboard (GitHub Pages)
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the repo (with the reading just saved)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Collect only the dashboard files
        run: |
          mkdir _site
          cp billing_dashboard.html billing_data.json billing_data.js _site/
          cp billing_dashboard.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
