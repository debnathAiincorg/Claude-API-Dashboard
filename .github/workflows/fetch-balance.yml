# Started by Power Automate (GitHub connector: "Create a repository dispatch event",
# Event Name = fetch-balance) or by the "Run workflow" button.
#
#   1. run fetch_billing.py  -> fetch balance, save billing_data.json, end
#   2. publish billing_dashboard.html + billing_data.json on GitHub Pages
#
# Step 1 runs on the self-hosted runner on your PC, because the Claude login
# only exists there.

name: Fetch credit balance

on:
  repository_dispatch:
    types: [fetch-balance]
  workflow_dispatch:

concurrency:
  group: fetch-balance
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, Windows]
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      BILLING_PROFILE_DIR: D:\Claude API Dashboard\.edge_billing_profile
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Run fetch_billing.py
        run: python fetch_billing.py

      - name: Save billing_data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billing_data.json
          git commit -m "New balance reading"
          git push

  publish:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - run: |
          mkdir _site
          cp billing_dashboard.html billing_data.json _site/
          cp billing_dashboard.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
